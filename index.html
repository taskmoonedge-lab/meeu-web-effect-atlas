<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEEU Web Effect Atlas</title><style>html,body,#app{margin:0;height:100%;background:#080c0f;color:#f4f7f8;font-family:Inter,system-ui,sans-serif}body{overflow:hidden}header{height:72px;border-bottom:1px solid #273139;display:flex;align-items:center;justify-content:space-between;padding:0 22px}main{height:calc(100% - 72px);display:grid;grid-template-columns:310px minmax(0,1fr) 340px}.menu,.detail{overflow:auto;padding:14px;background:#090e12}.menu{border-right:1px solid #273139}.detail{border-left:1px solid #273139}section{padding:18px;display:grid;place-items:center}.stage{width:100%;aspect-ratio:16/9;border:1px solid #273139;border-radius:18px;display:grid;place-items:center;overflow:hidden}</style></head><body><div id="app"></div><script type="module">import '/src/style.css';import '/src/main.js';</script></body></html>
