name: Preview Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run preview audit
        run: node scripts/audit-previews.mjs
      - name: Build
        run: |
          npm install
          npm run build
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-audit
          path: audit/preview-audit.json
