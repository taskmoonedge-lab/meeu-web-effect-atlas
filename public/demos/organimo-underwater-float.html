<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Underwater Product Float Study</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f4a8c4;color:#fff;font-family:Inter,system-ui,sans-serif}body{height:240vh;overflow-x:hidden}.scene{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#ffd2df 0 12%,#f3a7c3 38%,#ca6e9c 72%,#7f3c6f 100%)}.fog{position:absolute;inset:-20%;background:radial-gradient(circle at 30% 35%,#fff7 0 8%,transparent 28%),radial-gradient(circle at 70% 60%,#ffd9e777 0 10%,transparent 30%),radial-gradient(circle at 45% 80%,#d46aa755 0 14%,transparent 34%);filter:blur(36px);animation:fog 14s ease-in-out infinite alternate;mix-blend-mode:screen}.caustics{position:absolute;inset:-30%;opacity:.25;background:repeating-radial-gradient(ellipse at 50% 0%,transparent 0 18px,#fff7 20px 22px,transparent 25px 48px);filter:blur(5px);transform:rotate(-8deg) scale(1.4);animation:caustics 10s linear infinite}.depth{position:absolute;inset:0;background:linear-gradient(180deg,#fff2 0,transparent 28%,#5a275055 100%)}canvas{position:absolute;inset:0;width:100%;height:100%}.product-wrap{position:absolute;left:50%;top:52%;width:min(32vw,300px);aspect-ratio:.58;transform-style:preserve-3d;perspective:1200px;will-change:transform}.bottle{position:absolute;inset:0;transform-style:preserve-3d;filter:drop-shadow(0 32px 45px #5e1e514d)}.body{position:absolute;left:14%;right:14%;top:17%;bottom:7%;border-radius:44% 44% 24% 24%/18% 18% 12% 12%;background:linear-gradient(90deg,#8f3d77 0,#e08ab2 18%,#ffd6e5 48%,#c66b9e 72%,#7b336d 100%);box-shadow:inset -18px 0 26px #5a1f5444,inset 14px 0 20px #fff6}.cap{position:absolute;left:31%;right:31%;top:4%;height:18%;border-radius:18px 18px 8px 8px;background:linear-gradient(90deg,#5f2958,#bd72a2 45%,#f7c4da 65%,#6a2a60)}.neck{position:absolute;left:36%;right:36%;top:14%;height:10%;background:linear-gradient(90deg,#7c396d,#dc8fb3 50%,#7e386e)}.label{position:absolute;left:24%;right:24%;top:42%;height:24%;border:1px solid #fff8;border-radius:12px;background:#fff2;backdrop-filter:blur(4px);display:grid;place-items:center;text-align:center;letter-spacing:.18em;font-weight:700;font-size:clamp(12px,1.2vw,18px);text-shadow:0 1px 10px #6e2d61}.glow{position:absolute;left:10%;right:10%;top:30%;height:45%;border-radius:50%;background:radial-gradient(circle,#ffdff188 0,transparent 68%);filter:blur(20px);transform:translateZ(-60px)}.copy{position:fixed;left:5vw;top:8vh;z-index:5}.copy small{display:block;letter-spacing:.24em;font-size:11px;opacity:.8}.copy h1{font-size:clamp(38px,6vw,86px);line-height:.9;margin:.18em 0;font-weight:750}.copy p{max-width:420px;line-height:1.5;opacity:.78}.hint{position:fixed;right:4vw;bottom:4vh;font-size:11px;letter-spacing:.2em;opacity:.75}.floor{position:absolute;left:-10%;right:-10%;bottom:-10%;height:38%;background:radial-gradient(ellipse at 50% 0%,#ffdbeb55 0,transparent 60%),linear-gradient(180deg,transparent,#55244b66);filter:blur(8px)}@keyframes fog{to{transform:translate3d(5%,-3%,0) scale(1.08)}}@keyframes caustics{to{transform:rotate(-8deg) translate3d(4%,-2%,0) scale(1.4)}}@media(max-width:800px){.product-wrap{width:52vw}.copy{top:5vh}.copy p{max-width:70vw}}</style></head><body><div class="scene"><div class="fog"></div><div class="caustics"></div><canvas id="particles"></canvas><div class="depth"></div><div class="floor"></div><div class="product-wrap" id="product"><div class="bottle"><div class="glow"></div><div class="cap"></div><div class="neck"></div><div class="body"></div><div class="label">MEEU<br>SEA STUDY</div></div></div></div><div class="copy"><small>UNDERWATER / PRODUCT STUDY</small><h1>FLOAT<br>IN PINK.</h1><p>Organimoの“水中に商品が浮遊し、スクロールで空間と商品が連動する”要素だけを一般化して試作。</p></div><div class="hint">SCROLL TO DOLLY ↓</div><script>const c=document.querySelector('#particles'),x=c.getContext('2d'),p=document.querySelector('#product');let W,H,dpr=Math.min(devicePixelRatio||1,2),pts=[];function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+'px';c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);pts=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:.7+Math.random()*2.2,s:.18+Math.random()*.55,a:.15+Math.random()*.45,dr:(Math.random()-.5)*.12}))}function draw(){x.clearRect(0,0,W,H);for(const q of pts){q.y-=q.s;q.x+=q.dr;if(q.y<-10){q.y=H+10;q.x=Math.random()*W}x.beginPath();x.arc(q.x,q.y,q.r,0,Math.PI*2);x.fillStyle='rgba(255,245,250,'+q.a+')';x.fill()}requestAnimationFrame(draw)}function update(){const max=document.documentElement.scrollHeight-innerHeight,t=max?scrollY/max:0,breath=Math.sin(performance.now()/1300)*6;const y=(t-.5)*-90+breath,scale=.82+t*.52,rot=-16+t*76,tilt=8-Math.sin(t*Math.PI)*15,depth=-80+t*220;p.style.transform=`translate(-50%,-50%) translate3d(0,${y}px,0) scale(${scale}) rotateY(${rot}deg) rotateX(${tilt}deg)`;requestAnimationFrame(update)}addEventListener('resize',resize);resize();draw();update();</script></body></html>
