name: Preview Audit
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run preview audit
        run: node scripts/audit-previews.mjs
      - name: Build
        run: |
          npm install
          npm run build
      - name: Install browser audit dependency
        run: |
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Run rendered visual audit
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/meeu-vite.log 2>&1 &
          for i in {1..30}; do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/visual-audit.mjs
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-audit
          path: audit/*.json
