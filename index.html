<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MEEU Web Effect Atlas</title><style>*{box-sizing:border-box}html,body,#app{margin:0;width:100%;height:100%;background:#080c0f;color:#f4f7f8;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{overflow:hidden;background:#080c0f}button,input{font:inherit}header{height:72px;border-bottom:1px solid #273139;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#080c0f}header>div{display:grid;gap:4px}header small{color:#80949e}header input{width:360px;background:#0d1317;border:1px solid #273139;border-radius:12px;padding:12px 14px;color:#fff}main{height:calc(100vh - 72px);display:grid;grid-template-columns:310px minmax(0,1fr) 340px;background:#080c0f}.menu,.detail{min-width:0;overflow:auto;padding:14px;background:#090e12}.menu{border-right:1px solid #273139}.detail{border-left:1px solid #273139}.cats{display:flex;gap:6px;overflow:auto;padding-bottom:9px}.chip{white-space:nowrap;border:1px solid #304048;border-radius:999px;background:#0d1317;color:#dce7ea;padding:7px 10px}.chip.on{background:#8ff0cf;color:#07110e;border-color:#8ff0cf}.result{font-size:11px;color:#71858f;padding:8px 2px}.item{display:block;width:100%;text-align:left;background:#090e12;color:#eef3f5;border:1px solid #273139;border-radius:12px;padding:12px;margin:6px 0;cursor:pointer}.item b{display:block;font-size:16px}.item small,.variant small,.en{display:block;color:#8098a4;margin-top:4px}.item.on{border-color:#79bca8;box-shadow:inset 3px 0 #8ff0cf;background:#10191a}section{min-width:0;padding:18px;display:grid;place-items:center;background:#080c0f}.stage{width:100%;max-width:980px;aspect-ratio:16/9;border:1px solid #273139;border-radius:18px;position:relative;overflow:hidden;display:grid;place-items:center;background:linear-gradient(145deg,#111a20,#070a0d)}.detail h2{margin:8px 0 4px;font-size:28px}.detail p{color:#aebdc4;line-height:1.55}.detail h3{font-size:10px;letter-spacing:.15em;color:#70838c;margin-top:22px}.badges{display:flex;gap:6px;flex-wrap:wrap}.badges span{font-size:10px;border:1px solid #304048;border-radius:999px;padding:5px 8px;color:#aebdc4}.variant{border:1px solid #273139;border-radius:9px;padding:9px 10px;margin:6px 0;color:#cbd6da}.pv{position:relative;z-index:2}.unmapped{display:grid;gap:10px;text-align:center;color:#70838c}.unmapped b{font-size:42px;color:#fff}@media(max-width:900px){body{overflow:auto}header{height:auto;padding:14px;display:grid;gap:10px}header input{width:100%}main{height:auto;display:block}.menu,.detail{overflow:visible;border:0}section{min-height:420px}.stage{aspect-ratio:16/10}}</style></head><body><div id="app"></div><script type="module" src="/src/entry.js"></script></body></html>
