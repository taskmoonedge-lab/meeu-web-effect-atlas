<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxury Watch WebGL Study</title><style>*{box-sizing:border-box}html,body{margin:0;background:#070707;color:#eee;font-family:Inter,system-ui;height:100%;overflow:hidden}canvas{position:fixed;inset:0;width:100%;height:100%}.ui{position:fixed;inset:0;padding:28px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start}.ui b{letter-spacing:.16em;font-size:11px}.ui span{font-size:10px;color:#aaa;letter-spacing:.12em}.bottom{position:fixed;bottom:25px;left:28px;font-size:11px;color:#aaa;letter-spacing:.12em}</style></head><body><canvas id="c"></canvas><div class="ui"><b>HOROLOGY / REAL WEBGL</b><span>POINTER TO ORBIT · WHEEL TO ZOOM</span></div><div class="bottom">PBR STEEL · SAPPHIRE GLASS · BRUSHED DIAL · 60 INDICES · MOVING HANDS</div><script type="module">import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js';import {RoomEnvironment} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/environments/RoomEnvironment.js';
const renderer=new THREE.WebGLRenderer({canvas:document.querySelector('#c'),antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070707);const pmrem=new THREE.PMREMGenerator(renderer);scene.environment=pmrem.fromScene(new RoomEnvironment(),.04).texture;const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,.1,8.4);
const watch=new THREE.Group();watch.rotation.x=-.12;scene.add(watch);const steel=new THREE.MeshPhysicalMaterial({color:0xd8d9d6,metalness:1,roughness:.18,clearcoat:.25,clearcoatRoughness:.08});const brushed=new THREE.MeshPhysicalMaterial({color:0x17191b,metalness:.78,roughness:.31,clearcoat:.18});const polished=new THREE.MeshPhysicalMaterial({color:0xf2f0e8,metalness:1,roughness:.07});const gold=new THREE.MeshPhysicalMaterial({color:0xc9a45c,metalness:1,roughness:.16});const lume=new THREE.MeshStandardMaterial({color:0xe9eee1,roughness:.4,emissive:0xa8c8b0,emissiveIntensity:.05});const glass=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.02,transmission:.96,thickness:.18,ior:1.52,clearcoat:1,transparent:true,opacity:1});
const caseOuter=new THREE.Mesh(new THREE.CylinderGeometry(2.55,2.55,.55,128),steel);caseOuter.rotation.x=Math.PI/2;watch.add(caseOuter);const bezel=new THREE.Mesh(new THREE.TorusGeometry(2.28,.18,32,160),polished);watch.add(bezel);const dial=new THREE.Mesh(new THREE.CylinderGeometry(2.08,2.08,.11,128),brushed);dial.rotation.x=Math.PI/2;dial.position.z=.31;watch.add(dial);
for(let i=0;i<60;i++){const major=i%5===0;const g=new THREE.BoxGeometry(major?.055:.018,major?.42:.18,.055);const m=new THREE.Mesh(g,major?lume:polished);const a=i/60*Math.PI*2;m.position.set(Math.sin(a)*(major?1.70:1.82),Math.cos(a)*(major?1.70:1.82),.43);m.rotation.z=-a;watch.add(m)}
const center=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,.15,32),gold);center.rotation.x=Math.PI/2;center.position.z=.55;watch.add(center);function hand(w,h,z,mat){const pivot=new THREE.Group();pivot.position.z=z;const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,.055),mat);m.position.y=h*.34;pivot.add(m);watch.add(pivot);return pivot}const hour=hand(.13,1.12,.49,lume),minute=hand(.09,1.58,.51,lume),second=hand(.025,1.82,.54,gold);
const sapphire=new THREE.Mesh(new THREE.CylinderGeometry(2.13,2.13,.10,128),glass);sapphire.rotation.x=Math.PI/2;sapphire.position.z=.57;watch.add(sapphire);
const crown=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.48,48),steel);crown.rotation.z=Math.PI/2;crown.position.set(2.78,0,0);watch.add(crown);for(let i=0;i<12;i++){const a=i/12*Math.PI*2;const ridge=new THREE.Mesh(new THREE.BoxGeometry(.12,.055,.42),polished);ridge.position.set(2.78,.25*Math.cos(a),.25*Math.sin(a));ridge.rotation.x=a;watch.add(ridge)}
const lugGeo=new THREE.BoxGeometry(.48,.85,.42);for(const sx of [-1,1])for(const sy of [-1,1]){const lug=new THREE.Mesh(lugGeo,steel);lug.position.set(sx*1.75,sy*2.36,-.08);lug.rotation.z=sx*sy*.12;watch.add(lug)}
const strapMat=new THREE.MeshPhysicalMaterial({color:0x11100f,roughness:.62,metalness:.05,clearcoat:.18});for(const sy of [-1,1]){const strap=new THREE.Mesh(new THREE.BoxGeometry(2.0,3.0,.30,12,12,2),strapMat);strap.position.set(0,sy*3.75,-.20);watch.add(strap);for(let i=-3;i<=3;i++){const stitch=new THREE.Mesh(new THREE.BoxGeometry(1.62,.018,.025),new THREE.MeshBasicMaterial({color:0x6d665a}));stitch.position.set(0,sy*(2.65+i*.34),-.035);watch.add(stitch)}}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(30,30),new THREE.MeshPhysicalMaterial({color:0x090909,metalness:.15,roughness:.38}));floor.rotation.x=-Math.PI/2;floor.position.y=-5.4;floor.receiveShadow=true;scene.add(floor);const key=new THREE.RectAreaLight(0xffffff,12,5,8);key.position.set(-4,5,5);key.lookAt(0,0,0);scene.add(key);const rim=new THREE.RectAreaLight(0x9ecbff,9,3,6);rim.position.set(5,1,2);rim.lookAt(0,0,0);scene.add(rim);const warm=new THREE.PointLight(0xffc27a,18,12);warm.position.set(-3,-3,4);scene.add(warm);
let tx=0,ty=0,mx=0,my=0,zoom=8.4;addEventListener('pointermove',e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});addEventListener('wheel',e=>{zoom=THREE.MathUtils.clamp(zoom+e.deltaY*.004,5.3,10)},{passive:true});addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});const clock=new THREE.Clock();function tick(){const t=clock.getElapsedTime();mx+=(tx-mx)*.045;my+=(ty-my)*.045;watch.rotation.y=mx*.55+Math.sin(t*.18)*.10;watch.rotation.x=-.12+my*.25;watch.rotation.z=Math.sin(t*.25)*.025;watch.position.y=Math.sin(t*.5)*.05;camera.position.z+=(zoom-camera.position.z)*.06;camera.lookAt(0,0,0);const d=new Date();second.rotation.z=-(d.getSeconds()+d.getMilliseconds()/1000)/60*Math.PI*2;minute.rotation.z=-(d.getMinutes()+d.getSeconds()/60)/60*Math.PI*2;hour.rotation.z=-((d.getHours()%12)+d.getMinutes()/60)/12*Math.PI*2;renderer.render(scene,camera);requestAnimationFrame(tick)}tick();</script></body></html>
